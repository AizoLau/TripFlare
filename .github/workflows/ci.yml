name: CI

env:
  PYTHONUTF8: '1'

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax compile check
        run: |
          python -m py_compile tripflare.py tripflare_ui.pyw tripflare_tray.pyw tests/test_core.py

      - name: Run unit tests (stdlib, zero live AI)
        run: |
          python -m unittest discover -s tests -v

      - name: Initialize baseline and benchmark scanner
        run: |
          python tripflare.py --init
          python tripflare.py --bench

      - name: Verify Console UI (zh + en) and Win32 Tray menus
        run: |
          python tripflare_ui.pyw --selftest
          python tripflare_tray.pyw --menutest
