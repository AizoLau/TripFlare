<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="TripFlare real-time tripwire detection and AI triage workflow">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.6" opacity="0.45"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes step1Fade {
        0%, 6% { opacity: 0; transform: translateY(6px); }
        12%, 92% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; transform: translateY(0); }
      }
      @keyframes step2Fade {
        0%, 24% { opacity: 0; transform: translateY(6px); }
        30%, 92% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; transform: translateY(0); }
      }
      @keyframes step3Fade {
        0%, 44% { opacity: 0; transform: translateY(6px); }
        50%, 92% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; transform: translateY(0); }
      }
      @keyframes wireFlow {
        0% { stroke-dashoffset: 36; opacity: 0.25; }
        45%, 88% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.25; }
      }

      .pulse { transform-origin: 48px 42px; animation: pulseDot 2s ease-in-out infinite; }
      .s1 { animation: step1Fade 9s ease-out infinite; }
      .s2 { animation: step2Fade 9s ease-out infinite; }
      .s3 { animation: step3Fade 9s ease-out infinite; }
      .wire { stroke-dasharray: 6 4; animation: wireFlow 3s linear infinite; }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="0" y="0" width="920" height="470" rx="14" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="920" height="470" rx="14" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="918.5" height="468.5" rx="13.5" fill="none" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Top Bar -->
  <rect x="16" y="16" width="888" height="52" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <circle cx="48" cy="42" r="6" fill="#22c55e" class="pulse"/>
  <text x="66" y="47" class="sans" fill="#f8fafc" font-size="16" font-weight="700">TripFlare</text>
  <text x="148" y="47" class="mono" fill="#64748b" font-size="12">v0.2.0 · Win32 Real-Time Tripwire + Local/Cloud AI Triage</text>

  <!-- Language & Runtime Badges -->
  <rect x="650" y="28" width="126" height="28" rx="6" fill="#172554" stroke="#1d4ed8"/>
  <text x="713" y="46" text-anchor="middle" class="mono" fill="#93c5fd" font-size="11" font-weight="600">0.0% IDLE CPU</text>

  <rect x="786" y="28" width="102" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="837" y="46" text-anchor="middle" class="mono" fill="#e2e8f0" font-size="11" font-weight="600">EN / 中文</text>

  <!-- LEFT PANE: Real-Time Tripwire Detection -->
  <rect x="16" y="82" width="420" height="328" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="34" y="108" class="sans" fill="#cbd5e1" font-size="12" font-weight="700" letter-spacing="0.8">1. KERNEL-FREE REAL-TIME HOOK</text>
  <rect x="282" y="93" width="138" height="22" rx="5" fill="#172554" stroke="#2563eb" stroke-opacity="0.6"/>
  <text x="351" y="108" text-anchor="middle" class="mono" fill="#60a5fa" font-size="10">ReadDirectoryChangesW</text>

  <!-- Alert Card 1 -->
  <g class="s1">
    <rect x="30" y="126" width="392" height="122" rx="8" fill="#18121e" stroke="#ef4444" stroke-opacity="0.7"/>
    <rect x="30" y="126" width="5" height="122" rx="2" fill="url(#accentGrad)"/>
    <rect x="46" y="138" width="52" height="20" rx="4" fill="#991b1b"/>
    <text x="72" y="152" text-anchor="middle" class="mono" fill="#fecaca" font-size="11" font-weight="700">HIGH</text>
    <rect x="106" y="138" width="76" height="20" rx="4" fill="#27272a"/>
    <text x="144" y="152" text-anchor="middle" class="mono" fill="#fca5a5" font-size="11">Score: 10</text>
    <text x="410" y="152" text-anchor="end" class="mono" fill="#94a3b8" font-size="10.5">0.4s latency</text>

    <text x="46" y="176" class="mono" fill="#f8fafc" font-size="12" font-weight="700">Downloads\Invoice_2026.exe</text>
    <text x="46" y="198" class="mono" fill="#fda4af" font-size="11">• PE OriginalFilename: CertUtil.exe (LOLBin Masquerade)</text>
    <text x="46" y="216" class="mono" fill="#cbd5e1" font-size="11">• Authenticode signature missing (+2)</text>
    <text x="46" y="234" class="mono" fill="#cbd5e1" font-size="11">• Executable created outside trusted root (+2)</text>
  </g>

  <!-- Alert Card 2 -->
  <g class="s2">
    <rect x="30" y="262" width="392" height="114" rx="8" fill="#161925" stroke="#f59e0b" stroke-opacity="0.65"/>
    <rect x="30" y="262" width="5" height="114" rx="2" fill="#f59e0b"/>
    <rect x="46" y="274" width="52" height="20" rx="4" fill="#92400e"/>
    <text x="72" y="288" text-anchor="middle" class="mono" fill="#fde68a" font-size="11" font-weight="700">WARN</text>
    <rect x="106" y="274" width="76" height="20" rx="4" fill="#27272a"/>
    <text x="144" y="288" text-anchor="middle" class="mono" fill="#fcd34d" font-size="11">Score: 8</text>
    <text x="410" y="288" text-anchor="end" class="mono" fill="#94a3b8" font-size="10.5">Baseline diff</text>

    <text x="46" y="312" class="mono" fill="#f8fafc" font-size="12" font-weight="700">HKCU\...\Run\UpdaterSvc</text>
    <text x="46" y="334" class="mono" fill="#fde68a" font-size="11">• Target points to %TEMP%\svc_9f2a.exe (+3)</text>
    <text x="46" y="352" class="mono" fill="#cbd5e1" font-size="11">• New Run key persistence added (+3)</text>
  </g>

  <!-- Animated Connector Arrow -->
  <path d="M 442 238 L 478 238" stroke="url(#aiGrad)" stroke-width="2.5" class="wire"/>
  <polygon points="476,232 486,238 476,244" fill="#818cf8"/>

  <!-- RIGHT PANE: AI Triage & Action -->
  <rect x="488" y="82" width="416" height="328" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <text x="506" y="108" class="sans" fill="#cbd5e1" font-size="12" font-weight="700" letter-spacing="0.8">2. ZERO-DEP AI TRIAGE ENGINE</text>
  <rect x="750" y="93" width="138" height="22" rx="5" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.7"/>
  <text x="819" y="108" text-anchor="middle" class="mono" fill="#a5b4fc" font-size="10">Ollama / OpenAI / CLI</text>

  <g class="s3">
    <rect x="502" y="126" width="388" height="250" rx="8" fill="#090d16" stroke="#334155"/>

    <rect x="518" y="142" width="174" height="24" rx="5" fill="#7f1d1d" stroke="#ef4444" stroke-opacity="0.6"/>
    <text x="605" y="158" text-anchor="middle" class="mono" fill="#fecaca" font-size="11" font-weight="700">VERDICT: MALICIOUS</text>
    <text x="874" y="158" text-anchor="end" class="mono" fill="#38bdf8" font-size="10.5">ollama:qwen2.5</text>

    <text x="518" y="188" class="sans" fill="#94a3b8" font-size="11" font-weight="700">EVIDENCE</text>
    <text x="518" y="208" class="mono" fill="#e2e8f0" font-size="11">1. Invoice_2026.exe embeds PE OriginalFilename</text>
    <text x="518" y="226" class="mono" fill="#e2e8f0" font-size="11">   CertUtil.exe — classic LOLBin masquerade.</text>
    <text x="518" y="248" class="mono" fill="#e2e8f0" font-size="11">2. Unsigned %TEMP%\svc_9f2a.exe registered in</text>
    <text x="518" y="266" class="mono" fill="#e2e8f0" font-size="11">   HKCU\...\Run for reboot persistence.</text>

    <line x1="518" y1="284" x2="874" y2="284" stroke="#1e293b"/>
    <text x="518" y="304" class="sans" fill="#94a3b8" font-size="11" font-weight="700">RECOMMENDED ACTION</text>
    <rect x="518" y="314" width="356" height="46" rx="6" fill="#0f291e" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="530" y="333" class="mono" fill="#6ee7b7" font-size="11" font-weight="600">[1-Click] Quarantine binary + terminate tree</text>
    <text x="530" y="350" class="mono" fill="#a7f3d0" font-size="10.5">reg delete HKCU\...\Run /v UpdaterSvc /f</text>
  </g>

  <!-- Bottom Feature Strip -->
  <rect x="16" y="422" width="888" height="32" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="34" y="442" class="mono" fill="#94a3b8" font-size="11">✓ Python 3.8+ Stdlib Only (Zero pip installs)</text>
  <text x="328" y="442" class="mono" fill="#94a3b8" font-size="11">✓ SHA-256 + Authenticode + PE Masquerade</text>
  <text x="646" y="442" class="mono" fill="#94a3b8" font-size="11">✓ Local Ollama or Any OpenAI API</text>
</svg>
